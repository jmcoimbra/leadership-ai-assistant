  <line x1="32" y1="40" x2="20" y2="34" stroke="#60A5FA" stroke-width="0.8" opacity="0.5"/>
  <line x1="32" y1="40" x2="44" y2="34" stroke="#60A5FA" stroke-width="0.8" opacity="0.5"/>
  <line x1="32" y1="40" x2="24" y2="44" stroke="#60A5FA" stroke-width="0.8" opacity="0.5"/>
  <line x1="32" y1="40" x2="40" y2="44" stroke="#60A5FA" stroke-width="0.8" opacity="0.5"/>
  <line x1="22" y1="22" x2="14" y2="26" stroke="#60A5FA" stroke-width="0.8" opacity="0.5"/>
  <line x1="42" y1="22" x2="50" y2="26" stroke="#60A5FA" stroke-width="0.8" opacity="0.5"/>
  <line x1="20" y1="34" x2="12" y2="38" stroke="#60A5FA" stroke-width="0.8" opacity="0.5"/>
  <line x1="44" y1="34" x2="52" y2="38" stroke="#60A5FA" stroke-width="0.8" opacity="0.5"/>
  <line x1="22" y1="22" x2="32" y2="14" stroke="#60A5FA" stroke-width="0.8" opacity="0.5"/>
  <line x1="42" y1="22" x2="32" y2="14" stroke="#60A5FA" stroke-width="0.8" opacity="0.5"/>
  <line x1="24" y1="44" x2="32" y2="50" stroke="#60A5FA" stroke-width="0.8" opacity="0.5"/>
  <line x1="40" y1="44" x2="32" y2="50" stroke="#60A5FA" stroke-width="0.8" opacity="0.5"/>

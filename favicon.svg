<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Leadership AI Assistant — compass + network nodes -->
  <!-- Background -->
  <circle cx="32" cy="32" r="30" fill="#0F172A"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#1E293B" stroke-width="0.5"/>

  <!-- Compass ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#475569" stroke-width="0.6" opacity="0.6"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#475569" stroke-width="0.4" opacity="0.4"/>

  <!-- Cardinal direction lines (subtle) -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="#334155" stroke-width="0.5" opacity="0.5"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="#334155" stroke-width="0.5" opacity="0.5"/>

  <!-- Compass needle (north-pointing, dual-toned blade) -->
  <polygon points="32,12 36,32 32,52 28,32" fill="#3B82F6" opacity="0.9"/>
  <polygon points="32,12 36,32 32,32" fill="#60A5FA"/>
  <polygon points="32,32 28,32 32,52" fill="#1E40AF"/>

  <!-- Cardinal nodes (network at compass points) -->
  <circle cx="32" cy="10" r="2.5" fill="#60A5FA"/>
  <circle cx="32" cy="54" r="2.5" fill="#3B82F6"/>
  <circle cx="10" cy="32" r="2.5" fill="#3B82F6"/>
  <circle cx="54" cy="32" r="2.5" fill="#3B82F6"/>

  <!-- Inter-cardinal smaller nodes -->
  <circle cx="48" cy="16" r="1.6" fill="#475569"/>
  <circle cx="16" cy="16" r="1.6" fill="#475569"/>
  <circle cx="48" cy="48" r="1.6" fill="#475569"/>
  <circle cx="16" cy="48" r="1.6" fill="#475569"/>

  <!-- Faint connective lines between nodes -->
  <line x1="32" y1="10" x2="48" y2="16" stroke="#3B82F6" stroke-width="0.4" opacity="0.35"/>
  <line x1="32" y1="10" x2="16" y2="16" stroke="#3B82F6" stroke-width="0.4" opacity="0.35"/>
  <line x1="32" y1="54" x2="48" y2="48" stroke="#3B82F6" stroke-width="0.4" opacity="0.35"/>
  <line x1="32" y1="54" x2="16" y2="48" stroke="#3B82F6" stroke-width="0.4" opacity="0.35"/>
  <line x1="10" y1="32" x2="16" y2="48" stroke="#3B82F6" stroke-width="0.4" opacity="0.35"/>
  <line x1="10" y1="32" x2="16" y2="16" stroke="#3B82F6" stroke-width="0.4" opacity="0.35"/>
  <line x1="54" y1="32" x2="48" y2="48" stroke="#3B82F6" stroke-width="0.4" opacity="0.35"/>
  <line x1="54" y1="32" x2="48" y2="16" stroke="#3B82F6" stroke-width="0.4" opacity="0.35"/>

  <!-- Center pivot -->
  <circle cx="32" cy="32" r="2.5" fill="#0F172A" stroke="#60A5FA" stroke-width="1"/>
  <circle cx="32" cy="32" r="1" fill="#60A5FA"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Leadership AI Assistant - neural network in neutral steel blue -->

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#1F2937"/>

  <!-- Neural network nodes -->
  <!-- Core layer -->
  <circle cx="32" cy="28" r="3.5" fill="#60A5FA"/>
  <circle cx="32" cy="40" r="3" fill="#3B82F6"/>

  <!-- Middle layer -->
  <circle cx="22" cy="22" r="2.5" fill="#3B82F6"/>
  <circle cx="42" cy="22" r="2.5" fill="#3B82F6"/>
  <circle cx="20" cy="34" r="2.5" fill="#475569"/>
  <circle cx="44" cy="34" r="2.5" fill="#475569"/>
  <circle cx="24" cy="44" r="2" fill="#2563EB"/>
